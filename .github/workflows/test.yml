name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install -g pnpm && pnpm install
      - name: Build the project
        run: pnpm build
      - name: Check env var lists match
        run: pnpm check:env
      - name: Typecheck
        run: pnpm tsc
      - name: Lint
        run: pnpm lint
      - name: Run tests
        run: pnpm test
